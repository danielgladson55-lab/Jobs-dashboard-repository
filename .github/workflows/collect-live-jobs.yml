name: Collect Live Jobs and Publish Dashboard Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1,4,7,10,13,16 * * *"

permissions:
  contents: write

concurrency:
  group: live-job-collection
  cancel-in-progress: true

jobs:
  collect-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out Job Tracker
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install existing tracker dependencies
        run: |
          if [ -s requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Validate required Python files
        run: |
          python -m py_compile src/build_dashboard_feed.py

          if [ -f src/collect_company_portals.py ]; then
            python -m py_compile src/collect_company_portals.py
          fi

          if [ -f src/collect_workday_portals.py ]; then
            python -m py_compile src/collect_workday_portals.py
          fi

      - name: Collect official company portal jobs
        if: ${{ hashFiles('config/company-portals.json') != '' && hashFiles('src/collect_company_portals.py') != '' }}
        run: python src/collect_company_portals.py

      - name: Collect Workday portal jobs
        if: ${{ hashFiles('config/workday-portals.json') != '' && hashFiles('src/collect_workday_portals.py') != '' }}
        run: python src/collect_workday_portals.py

      - name: Build sanitized dashboard feed
        run: python src/build_dashboard_feed.py

      - name: Commit tracker updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ dashboard-feed/

          if git diff --cached --quiet; then
            echo "No tracker changes to commit."
          else
            git commit -m "Update live job portal feed"
            git push
          fi
