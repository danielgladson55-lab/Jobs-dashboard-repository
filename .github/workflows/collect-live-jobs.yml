name: Collect Live Jobs and Publish Dashboard Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1,4,7,10,13,16 * * *"

permissions:
  contents: write

concurrency:
  group: live-job-collection
  cancel-in-progress: true

jobs:
  collect-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Job Tracker
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install existing tracker dependencies
        run: |
          if [ -s requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Validate Python syntax
        run: |
          for f in \
            src/collect_company_portals.py \
            src/collect_workday_portals.py \
            src/build_dashboard_feed.py \
            src/publish_dashboard_feed.py; do
            if [ -f "$f" ]; then
              python -m py_compile "$f"
              echo "compiled: $f"
            else
              echo "::warning::skipping missing file $f"
            fi
          done

      - name: Collect official company portal jobs (Greenhouse / Lever)
        if: ${{ hashFiles('config/company-portals.json') != '' }}
        run: python src/collect_company_portals.py

      - name: Collect Workday portal jobs
        if: ${{ hashFiles('config/workday-portals.json') != '' }}
        run: python src/collect_workday_portals.py

      - name: Build sanitized dashboard feed
        run: python src/build_dashboard_feed.py

      - name: Commit tracker updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.csv data/portal-job-history.json dashboard-feed/jobs.json
          if git diff --cached --quiet; then
            echo "No tracker changes to commit."
          else
            git commit -m "Update live job portal feed"
            git push
          fi
